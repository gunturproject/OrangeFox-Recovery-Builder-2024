name: OrangeFox - Build X6515

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Stable OrangeFox branch; upstream sync currently supports 12.1 (14.1 intentionally excluded as experimental)'
        required: true
        default: '12.1'
        type: choice
        options: ['12.1']
      DEVICE_TREE:
        description: 'Device tree repository'
        required: true
        default: 'https://github.com/gunturproject/android_device_infinix_Infinix-X6515.git'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'vnd_x6515_h6127-user-12-SP1A.210812.016-308958-release-keys'
      DEVICE_PATH:
        description: 'Device tree path'
        required: true
        default: 'device/infinix/Infinix-X6515'
      DEVICE_NAME:
        description: 'Product codename (case-sensitive)'
        required: true
        default: 'Infinix-X6515'
      BUILD_TARGET:
        description: 'Image target'
        required: true
        default: 'recoveryimage'
        type: choice
        options: ['recoveryimage']
      REPO_SYNC_JOBS:
        description: 'Parallel repository sync jobs (increase carefully if network/disk is constrained)'
        required: true
        default: 16
        type: number

permissions:
  contents: read

concurrency:
  group: of-x6515-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify X6515 recovery
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.DEVICE_PATH }}' =~ ^[A-Za-z0-9_./-]+$ ]]
          [[ '${{ inputs.DEVICE_NAME }}' =~ ^[A-Za-z0-9_-]+$ ]]
          [[ '${{ inputs.BUILD_TARGET }}' == 'recoveryimage' ]]
          [[ '${{ inputs.REPO_SYNC_JOBS }}' =~ ^([2-9]|1[0-9]|2[0-4])$ ]]

      - name: Free disk space safely
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h "$GITHUB_WORKSPACE"
          sudo apt-get clean
          # Remove only known, unused hosted-runner toolchains/caches; retain Android SDK/build tools and GitHub runner assets.
          for path in /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/local/share/chromium /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator; do
            if [[ -e "$path" ]]; then
              echo "Removing unused runner payload: $path"
              sudo rm -rf -- "$path"
            fi
          done
          if command -v docker >/dev/null 2>&1; then sudo docker system prune -af --volumes || true; fi
          sudo rm -rf /var/lib/apt/lists/*
          rm -rf "$HOME/.cache/pip" "$HOME/.cache/go-build" "$HOME/.gradle/caches" 2>/dev/null || true
          echo 'Largest top-level runner directories after cleanup:'
          sudo du -xhd1 /usr /opt /home/runner 2>/dev/null | sort -h | tail -25 || true
          echo 'Disk after cleanup:'
          df -h "$GITHUB_WORKSPACE"

      - name: Prepare build host
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 zip unzip bc bison build-essential ccache flex g++-multilib gcc-multilib gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev
          git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts.git "$RUNNER_TEMP/of-scripts"
          sudo bash "$RUNNER_TEMP/of-scripts/setup/android_build_env.sh"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo 'Disk after build dependencies are installed:'
          df -h "$GITHUB_WORKSPACE"

      - name: Sync OrangeFox manifest
        shell: bash
        env:
          REPO_SYNC_JOBS: ${{ inputs.REPO_SYNC_JOBS }}
        run: |
          set -euo pipefail
          git config --global http.maxRequests 32
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$RUNNER_TEMP/of-sync"
          cp -a "$RUNNER_TEMP/of-sync/patches" "$GITHUB_WORKSPACE/patches"
          python3 - "$RUNNER_TEMP/of-sync/orangefox_sync.sh" <<'PYCODE'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          old = 'repo_sync() {\n\trepo sync --force-sync -c -j$(nproc --all) --no-clone-bundle --no-tags "$@";\n}'
          new = 'repo_sync() {\n  local attempt=1\n  local rc=0\n  while [ "$attempt" -le 3 ]; do\n    if repo sync --force-sync -c -j${REPO_SYNC_JOBS:-$(nproc --all)} --no-clone-bundle --no-tags "$@"; then\n      return 0\n    else\n      rc=$?\n    fi\n    echo "repo sync failed (attempt $attempt/3, rc=$rc); retrying after backoff"\n    sleep $((attempt * 15))\n    attempt=$((attempt + 1))\n  done\n  return "$rc"\n}'
          if old not in text:
              raise SystemExit('OrangeFox repo_sync function changed; refusing an unverified retry patch')
          path.write_text(text.replace(old, new, 1))
          PYCODE
          bash "$RUNNER_TEMP/of-sync/orangefox_sync.sh" --branch '${{ inputs.MANIFEST_BRANCH }}' --path "$GITHUB_WORKSPACE/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

      - name: Report disk usage after manifest sync
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          du -sh "$GITHUB_WORKSPACE/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}" "$GITHUB_WORKSPACE/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/.repo" 2>/dev/null || true

      - name: Fetch and audit X6515 device tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
          mkdir -p "$(dirname '${{ inputs.DEVICE_PATH }}')"
          git clone --depth=1 --branch '${{ inputs.DEVICE_TREE_BRANCH }}' '${{ inputs.DEVICE_TREE }}' '${{ inputs.DEVICE_PATH }}'
          cd '${{ inputs.DEVICE_PATH }}'
          test -s BoardConfig.mk
          test -s recovery.fstab
          test -s AndroidProducts.mk
          echo "DEVICE_TREE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          grep -Eq '^TARGET_BOARD_PLATFORM[[:space:]]*:=[[:space:]]*mt6761([[:space:]]|$)' BoardConfig.mk || { echo 'ERROR: device tree SoC does not match MT6761'; exit 1; }
          grep -q 'PRODUCT_MODEL := Infinix X6515' omni_Infinix-X6515.mk || { echo 'ERROR: product model is not Infinix X6515'; exit 1; }
          grep -Eq '^BOARD_SUPER_PARTITION_SIZE[[:space:]]*:=[[:space:]]*6723633152([[:space:]]|$)' BoardConfig.mk || { echo 'ERROR: BOARD_SUPER_PARTITION_SIZE differs from stock scatter (0x190c28000).'; exit 1; }
          grep -Eq '^BOARD_INFINIX_DYNAMIC_PARTITIONS_SIZE[[:space:]]*:=[[:space:]]*6719438848([[:space:]]|$)' BoardConfig.mk || { echo 'ERROR: dynamic-partition group size must preserve the verified 4 MiB headroom within stock SUPER.'; exit 1; }
          DATA_FSTAB=$(grep -E '^[[:space:]]*/data[[:space:]]' recovery.fstab || true)
          [[ -n "$DATA_FSTAB" ]] || { echo 'ERROR: no /data mount in recovery.fstab'; exit 1; }
          echo "$DATA_FSTAB" | grep -q 'f2fs' || { echo 'ERROR: /data filesystem differs from stock XOS f2fs'; exit 1; }
          echo "$DATA_FSTAB" | grep -q 'fileencryption=aes-256-xts:aes-256-cts:v2' || { echo 'ERROR: stock XOS fileencryption config is missing'; exit 1; }
          echo "$DATA_FSTAB" | grep -q 'keydirectory=/metadata/vold/metadata_encryption' || { echo 'ERROR: stock XOS keydirectory is missing'; exit 1; }
          echo '--- Product makefiles ---'
          cat AndroidProducts.mk
          TREE_FP=$(sed -n 's/^BUILD_FINGERPRINT := //p' omni_Infinix-X6515.mk | head -1)
          EXPECTED_FP='Infinix/X6515-OP/Infinix-X6515:12/SP1A.210812.016/241204V944:user/release-keys'
          echo "Tree fingerprint: ${TREE_FP:-not declared}"
          echo "Stock firmware fingerprint from supplied boot image: $EXPECTED_FP"
          [[ "$TREE_FP" == "$EXPECTED_FP" ]] || { echo 'ERROR: device tree fingerprint does not match the supplied stock XOS firmware; update/review the tree before building.'; exit 1; }
          grep -Fq 'PRIVATE_BUILD_DESC="vnd_x6515_h6127-user 12 SP1A.210812.016 764070 release-keys"' omni_Infinix-X6515.mk || { echo 'ERROR: private build description differs from the supplied stock boot image.'; exit 1; }
          echo '--- Userdata fstab line ---'
          if grep -E 'fileencryption|metadata_encryption|encryptable=|forceencrypt=|wrappedkey|keydirectory=' recovery.fstab; then
            echo 'Encryption-related fstab flags are present; runtime decryption still requires on-device tests.'
          else
            echo 'WARNING: no common Android file/metadata-encryption flags detected in recovery.fstab.'
            echo 'WARNING: decryption is unverified; requires matching vendor crypto/keymaster components and physical-device tests.'
          fi
          if grep -R -E 'TW_INCLUDE_CRYPTO|TW_USE_FSCRYPT|TW_INCLUDE_FBE|keymaster|keystore' --include='*.mk' --include='*.prop' .; then
            echo 'Crypto-related configuration references found; verify they match the shipped firmware.'
          else
            echo 'WARNING: no obvious crypto/keymaster configuration references found in device tree.'
          fi

      - name: Build OrangeFox recovery
        shell: bash
        run: |
          # Capture envsetup's return before errexit; some vendor setup scripts return nonzero after registering helpers.
          set -o pipefail
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
          # Required by OrangeFox: select the device before envsetup processes its build variables.
          export FOX_BUILD_DEVICE='${{ inputs.DEVICE_NAME }}'
          # Scatter and BoardConfig confirm A/B slots; this is not marked as Virtual A/B.
          export FOX_AB_DEVICE=1
          # Official guidance recommends vanilla mode and disabling MIUI-only features for non-Xiaomi devices.
          export FOX_VANILLA_BUILD=1
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
          export ALLOW_MISSING_DEPENDENCIES=true
          set +e
          source build/envsetup.sh
          ENVSETUP_RC=$?
          set -e
          echo "build/envsetup.sh returned $ENVSETUP_RC"
          if ! declare -F lunch >/dev/null; then
            echo 'ERROR: envsetup did not define the lunch function; stopping before compilation.'
            exit 1
          fi
          if ! lunch omni_${{ inputs.DEVICE_NAME }}-eng; then
            echo 'ERROR: requested omni device lunch target is unavailable or its product config failed.'
            exit 1
          fi
          mka -j2 adbd recoveryimage

      - name: Validate output image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}"
          IMAGE="$OUT/recovery.img"
          if [[ ! -s "$IMAGE" ]]; then
            IMAGE=$(find "$OUT" -maxdepth 1 -type f -name 'OrangeFox*.img' -size +0c -print -quit)
          fi
          if [[ ! -s "$IMAGE" ]]; then
            echo 'ERROR: expected output image is missing or empty.'
            find "$OUT" -maxdepth 3 -type f -printf '%p (%s bytes)\n' 2>/dev/null || true
            exit 1
          fi
          file "$IMAGE"
          sha256sum "$IMAGE" | tee "$IMAGE.sha256"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${{ github.run_number }}
          path: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.image }}.sha256
          if-no-files-found: error
          retention-days: 30
